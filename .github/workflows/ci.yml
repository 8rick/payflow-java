
name: PayFlow - CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Compilar e testar
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: payflow
          POSTGRES_USER: payflow
          POSTGRES_PASSWORD: payflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payflow -d payflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Executar testes
        env:
          DB_URL: jdbc:postgresql://localhost:5432/payflow
          DB_USERNAME: payflow
          DB_PASSWORD: payflow
        run: ./mvnw -B verify